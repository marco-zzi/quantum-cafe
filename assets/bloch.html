<style>
  :root{--label:#f5f5f7;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.34);--ok:#32d74b;--bad:#ff453a;--acc:__ACC__;
        --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 var(--sys);background:transparent;color:var(--label);-webkit-font-smoothing:antialiased}
  .card{background:#13131a;border-radius:24px;padding:14px 14px 16px;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
  canvas{width:100%;max-width:520px;height:auto;aspect-ratio:520/340;display:block;margin:0 auto}
  .stat{margin:8px 4px 0;text-align:center;font-size:14px;color:var(--label2);font-variant-numeric:tabular-nums}
  .stat b{color:var(--label);font-weight:600}
  .lost{color:var(--bad);font-weight:600}.ok{color:var(--ok);font-weight:600}
  .row{display:flex;gap:10px;align-items:center;margin-top:12px}
  button{font:600 14px var(--sys);color:var(--label);background:rgba(255,255,255,.12);border:0;border-radius:999px;padding:8px 16px;cursor:pointer;transition:transform .1s,background .2s}
  button:active{transform:scale(.95)}
  button:focus-visible,input:focus-visible{outline:2px solid rgb(var(--acc));outline-offset:3px}
  input[type=range]{flex:1;min-width:120px;accent-color:rgb(var(--acc))}
</style>
<div class="card">
  <canvas id="c" width="1040" height="680" role="img" aria-label="Bloch sphere showing the qubit state fading"></canvas>
  <div class="stat" id="stat"></div>
  <div class="row">
    <button id="play">Pause</button><button id="restart">Restart</button>
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Scrub through the operations">
  </div>
</div>
<script>
const C = __CFG__;
const ACC = C.accent.join(',');
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 520, H = 340, cx = W*0.5, cy = H*0.52, R = H*0.36;
g.setTransform(2,0,0,2,0,0);
const FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif';
let u = 0, playing = true, last = null;
const stat = document.getElementById('stat'), scrub = document.getElementById('scrub');
const playBtn = document.getElementById('play');
const trail = [];

function state(n){
  const x = Math.exp(-n*C.delta);
  const z = C.z_eq*(1-Math.exp(-n*C.rate1));
  const xp = C.qec_per_op===null ? null : Math.exp(n*C.qec_per_op);
  return {x, z, xp};
}
function pt(x,z){ return [cx + x*R, cy - z*R]; }
function arrow(x,z,col,w){
  const [px,py] = pt(x,z);
  g.strokeStyle = col; g.fillStyle = col; g.lineWidth = w; g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx,cy); g.lineTo(px,py); g.stroke();
  g.beginPath(); g.arc(px,py,w*1.5,0,7); g.fill();
}
function label(t,x,y,col){ g.fillStyle=col||'rgba(235,235,245,.5)'; g.font='500 13px '+FONT; g.textAlign='center'; g.fillText(t,x,y); }

function draw(){
  const n = u*C.n_view, s = state(n);
  g.clearRect(0,0,W,H);
  g.strokeStyle='rgba(255,255,255,.16)'; g.lineWidth=1.5;
  g.beginPath(); g.arc(cx,cy,R,0,7); g.stroke();
  g.lineWidth=1; g.setLineDash([4,5]); g.strokeStyle='rgba(255,255,255,.12)';
  g.beginPath(); g.moveTo(cx-R,cy); g.lineTo(cx+R,cy); g.moveTo(cx,cy-R); g.lineTo(cx,cy+R); g.stroke();
  // the "lost" mark: below this length the qubit counts as lost
  g.strokeStyle='rgba(255,69,58,.7)'; g.beginPath(); g.moveTo(cx+C.x_lost*R,cy-R*0.45); g.lineTo(cx+C.x_lost*R,cy+R*0.45); g.stroke();
  g.setLineDash([]);
  label('|0⟩',cx,cy-R-8); label('|1⟩',cx,cy+R+19); label('|+⟩',cx+R+22,cy+5); label('|−⟩',cx-R-22,cy+5);
  label('fully mixed: the information is gone',cx,cy+R*0.62,'rgba(235,235,245,.28)');
  if (Math.abs(C.z_eq-1)>0.02){ const [ex,ey]=pt(0,C.z_eq); g.fillStyle='#64d2ff'; g.beginPath(); g.arc(ex,ey,4,0,7); g.fill();
    g.font='500 12px '+FONT; g.textAlign='left'; g.fillText('thermal',ex+9,ey+4); }
  trail.push(pt(s.x,s.z)); if(trail.length>160) trail.shift();
  g.strokeStyle='rgba('+ACC+',.3)'; g.lineWidth=2.5; g.lineJoin='round'; g.beginPath();
  trail.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.stroke();
  if (s.xp!==null) arrow(s.xp,0,'#32d74b',3);
  const F = (1+s.x)/2, lost = F < C.f_lost;
  arrow(s.x,s.z,lost?'#ff453a':'rgb('+ACC+')',4);
  // fidelity bar
  const bx = 14, bw = W-28, by = H-22;
  g.fillStyle='rgba(255,255,255,.1)'; g.beginPath(); g.roundRect(bx,by,bw,6,3); g.fill();
  g.fillStyle=lost?'#ff453a':'rgb('+ACC+')'; g.beginPath(); g.roundRect(bx,by,Math.max(6,bw*Math.max(0,(F-0.5)/0.5)),6,3); g.fill();
  g.fillStyle='#fff'; g.fillRect(bx+bw*((C.f_lost-0.5)/0.5)-1,by-4,2,14);

  let txt = 'Operations <b>'+Math.round(n).toLocaleString()+'</b>';
  if (C.show_time) txt += ' · time <b>'+fmtT(n*C.t_gate)+'</b>';
  txt += ' · fidelity <b>'+(F*100).toFixed(1)+'%</b> &nbsp;';
  txt += lost ? '<span class="lost">Lost</span>' : '<span class="ok">Alive</span>';
  if (s.xp!==null){ const Fp=(1+s.xp)/2; txt += '<br><span style="color:#32d74b">Green arrow: with the helper, fidelity '+(Fp*100).toFixed(1)+'%</span>'; }
  stat.innerHTML = txt;
  scrub.value = Math.round(u*1000);
}
function fmtT(t){ const U=[['s',1],['ms',1e-3],['µs',1e-6],['ns',1e-9],['ps',1e-12]];
  for (const [n,k] of U) if (t>=k) return (t/k).toPrecision(3)+' '+n; return t.toExponential(1)+' s'; }
function loop(ts){
  if(last===null) last=ts; const dt=(ts-last)/1000; last=ts;
  if(playing){ u += dt/14; if(u>=1){u=1; playing=false; playBtn.textContent='Play';} }
  draw(); requestAnimationFrame(loop);
}
playBtn.onclick=()=>{ if(u>=1) u=0; playing=!playing; playBtn.textContent=playing?'Pause':'Play'; };
document.getElementById('restart').onclick=()=>{u=0;trail.length=0;playing=true;playBtn.textContent='Pause';};
scrub.oninput=()=>{u=scrub.value/1000; playing=false; trail.length=0; playBtn.textContent='Play';};
requestAnimationFrame(loop);
</script>
