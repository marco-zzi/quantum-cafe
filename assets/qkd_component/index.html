<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0b0b10;--label:#f5f5f7;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.34);
        --fill:rgba(255,255,255,.07);--fill2:rgba(255,255,255,.13);--sep:rgba(255,255,255,.09);--acc:196,226,255;
        --sun:255,214,120;--moon:150,170,255;--ok:#32d74b;--bad:#ff453a;
        --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
        --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
        --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:transparent;color:var(--label);font:15px/1.45 var(--sys);-webkit-font-smoothing:antialiased}
  #root{background:var(--bg);border-radius:28px;padding:18px 18px 22px;overflow:hidden;max-width:720px;margin:0 auto}
  #root.wide{max-width:1000px}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  button:disabled{cursor:default}
  :focus-visible{outline:2px solid rgb(var(--acc));outline-offset:3px;border-radius:10px}
  .eyebrow{font:600 11px/1 var(--sys);letter-spacing:.08em;text-transform:uppercase;color:var(--label3)}
  .num{font-variant-numeric:tabular-nums}
  .mat{background:rgba(26,26,34,.66);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border-top:1px solid rgba(255,255,255,.14)}
  @media (prefers-reduced-transparency:reduce){.mat{background:#1c1c24;-webkit-backdrop-filter:none;backdrop-filter:none}}

  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .top h2{font:600 24px/1.1 var(--serif);letter-spacing:-.01em;margin:6px 0 0}
  .right{display:flex;gap:18px;text-align:right}
  .right b{display:block;font:700 22px/1 var(--disp);letter-spacing:-.02em;margin-top:5px}
  .who{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(var(--acc),.14);color:rgb(var(--acc));font:600 12px/1 var(--sys);letter-spacing:.02em;margin-left:8px;vertical-align:middle}

  #scene{margin:0 -2px 8px;position:relative;border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
  #scene canvas{width:100%;aspect-ratio:640/250;display:block}
  .goal{margin:8px 0 2px;color:var(--label2);font-size:14.5px}
  .note{margin:6px 0 12px;min-height:20px;color:rgb(var(--acc));font-size:14.5px}
  .strip{display:flex;flex-wrap:wrap;gap:8px 26px;margin:10px 2px 14px}
  .strip .v{font:600 17px/1.2 var(--disp);letter-spacing:-.01em;margin-top:6px}
  .panel{background:var(--fill);border-radius:22px;padding:16px 16px 18px;margin-bottom:12px}
  .panel h3{font:600 19px/1.2 var(--serif);letter-spacing:-.01em;margin:0 0 4px}
  .panel p{margin:4px 0 10px;color:var(--label2);font-size:14.5px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
  .seg{display:inline-flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
  .seg button{padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--label2);transition:background .2s,color .2s,transform .1s}
  .seg button:active{transform:scale(.96)}
  .seg button[aria-pressed="true"]{background:rgba(255,255,255,.16);color:var(--label)}
  .ghost{padding:9px 14px;border-radius:999px;background:var(--fill2);font-weight:600;font-size:14px;color:var(--label);transition:transform .1s,opacity .2s}
  .ghost:active:not(:disabled){transform:scale(.95)}.ghost:disabled{opacity:.35}
  .go{background:rgb(var(--acc));color:#0b1018;font:700 16px/1 var(--disp);letter-spacing:-.01em;padding:14px 26px;border-radius:999px;transition:transform .1s,filter .2s,opacity .2s}
  .go:hover:not(:disabled){filter:brightness(1.06)}.go:active:not(:disabled){transform:scale(.96)}.go:disabled{opacity:.35}
  .go.bad{background:var(--bad);color:#fff}.go.ok{background:var(--ok);color:#06210d}
  .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.acts .go{flex:1;min-width:140px}
  input[type=range]{width:100%;accent-color:rgb(var(--acc));margin:6px 0}
  .big{font:700 34px/1 var(--disp);letter-spacing:-.025em}

  /* wisps */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,38px));gap:8px 6px;margin:12px 0 4px;justify-content:start}
  .w{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0 6px;border-radius:12px;background:rgba(255,255,255,.05);min-height:38px}
  .w .i{font:600 10px/1 var(--sys);color:var(--label3);font-variant-numeric:tabular-nums}
  .w.dim{opacity:.32}
  .w.smp{background:rgba(var(--acc),.12);box-shadow:inset 0 0 0 1px rgba(var(--acc),.35)}
  .w.key{background:rgba(50,215,75,.10);box-shadow:inset 0 0 0 1px rgba(50,215,75,.28)}
  .w.known{background:rgba(255,69,58,.14);box-shadow:inset 0 0 0 1px rgba(255,69,58,.5)}
  .w.err{box-shadow:inset 0 0 0 1.5px var(--bad)}
  .c{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:700 14px/1 var(--disp);font-variant-numeric:tabular-nums;background:rgba(255,255,255,.07);color:var(--label2);transition:transform .1s,background .2s}
  button.c:active{transform:scale(.9)}
  .c svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .c.s{color:rgb(var(--sun));background:rgba(var(--sun),.14)}.c.m{color:rgb(var(--moon));background:rgba(var(--moon),.16)}
  .c.b0,.c.b1{color:var(--label);background:rgba(255,255,255,.12)}
  .c.empty{color:var(--label3);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
  .c.eq{box-shadow:0 0 0 1.5px var(--ok)}
  .c.ne{box-shadow:0 0 0 1.5px var(--bad)}
  .c.sm{width:22px;height:22px;font-size:12px;border-radius:7px}.c.sm svg{width:15px;height:15px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 2px;color:var(--label2);font-size:12.5px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend .c{width:20px;height:20px;border-radius:6px}.legend .c svg{width:14px;height:14px}
  .legend i{width:14px;height:14px;border-radius:5px;display:inline-block}

  .meter{position:relative;height:12px;border-radius:6px;background:rgba(255,255,255,.1);margin:22px 0 26px}
  .meter .f{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1),background .3s}
  .meter .t{position:absolute;top:-6px;bottom:-6px;width:2px;background:rgba(255,255,255,.7)}
  .meter .t em{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font:600 10.5px/1 var(--sys);color:var(--label2);font-style:normal;white-space:nowrap}
  .meter .t.s{background:rgba(var(--acc),.8)}.meter .t.s em{top:auto;bottom:-17px;color:rgb(var(--acc))}

  .verdict{text-align:center;padding:22px 18px 20px}
  .verdict h3{font:600 28px/1.1 var(--serif);letter-spacing:-.015em;margin:8px 0 2px}
  .verdict .stat{font:700 44px/1 var(--disp);letter-spacing:-.03em;margin:12px 0 2px}
  .verdict .stat small{display:block;font:500 14px/1.3 var(--sys);letter-spacing:0;color:var(--label2);margin-top:4px}
  .verdict p{margin:8px auto;max-width:46ch;color:var(--label2);font-size:14.5px}
  .verdict .fact{font-size:13px;color:var(--label3)}
  .verdict.good .eyebrow{color:var(--ok)}.verdict.badc .eyebrow{color:var(--bad)}
  .msg{padding:30px 18px;text-align:center;color:var(--label2)}
  .msg h3{font:600 24px/1.15 var(--serif);color:var(--label);margin:0 0 6px}
  .score3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .score3 div{background:var(--fill);border-radius:18px;padding:14px;text-align:center}
  .score3 b{display:block;font:700 30px/1.1 var(--disp);letter-spacing:-.02em;margin-top:6px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--label3);margin-right:6px}
  .dot.on{background:var(--ok)}.pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  @media (max-width:520px){
    #root{padding:14px 12px 18px;border-radius:24px}
    .top h2{font-size:21px}.right{gap:12px}.right b{font-size:19px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(32px,32px));gap:6px 4px}
    .c{width:25px;height:25px}.c svg{width:17px;height:17px}
  }
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}.meter .f,.seg button,.go,.ghost,.c{transition:none}}
</style></head>
<body>
<div id="root"><div id="scene" aria-hidden="true"></div><div id="main"></div></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const post = (type, data) => parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data), '*');
  const rnd = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, '0')).join('');
  let CLIENT = '';
  try { CLIENT = localStorage.getItem('qc_wisp_client') || ''; if (!CLIENT) { CLIENT = rnd(); localStorage.setItem('qc_wisp_client', CLIENT); } } catch (e) { CLIENT = rnd(); }
  let seq = 0, P = null, lastSig = '', busy = false, busyTimer = 0, draft = null, draftKey = '', flightKey = '', best = 0;
  try { best = +localStorage.getItem('qc_wisp_best') || 0; } catch (e) {}

  const setValue = value => post('streamlit:setComponentValue', { value, dataType: 'json' });
  const sendAct = (kind, payload) => {
    busy = true; clearTimeout(busyTimer); busyTimer = setTimeout(() => { busy = false; draw(); }, 5000);
    setValue({ type: 'act', kind, payload: payload || {}, nonce: CLIENT + ':' + Date.now() + ':' + (++seq), client: CLIENT });
    draw();
  };
  const fit = () => post('streamlit:setFrameHeight', { height: Math.ceil(document.documentElement.getBoundingClientRect().height) + 4 });

  const ICON = {
    sun: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>',
    moon: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.3 8.3 0 0 1 9.8 4 8.3 8.3 0 1 0 20 14.2z"/></svg>',
    none: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10"/></svg>',
  };
  const lensCls = l => l === 0 ? 's' : l === 1 ? 'm' : 'empty';
  const lensIcon = l => l === 0 ? ICON.sun : l === 1 ? ICON.moon : ICON.none;
  const lensName = l => l === 0 ? 'Sun' : l === 1 ? 'Moon' : 'none';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pct = x => Math.round(x * 100) + '%';
  const rb = () => crypto.getRandomValues(new Uint8Array(1))[0] & 1;

  // ---------- the scene: a night road between two towers, drawn on a canvas ----------
  const SW = 640, SH = 250;
  const cv = document.createElement('canvas');
  cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', 'Two towers joined by a road of light, with wisps in flight');
  $('scene').appendChild(cv);
  const g = cv.getContext('2d');
  const S = { storm: 0, eve: false, phase: '', fx: null, flights: [], t0: performance.now() };
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const mixc = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const SUN_C = [255, 214, 120], MOON_C = [150, 170, 255], RED_C = [255, 90, 80], WHITE = [235, 245, 255];
  const R0 = [96, 120], R1 = [210, 14], R2 = [430, 14], R3 = [544, 120], GROUND = 214;
  const bez = u => { const v = 1 - u; return [v * v * v * R0[0] + 3 * v * v * u * R1[0] + 3 * v * u * u * R2[0] + u * u * u * R3[0], v * v * v * R0[1] + 3 * v * v * u * R1[1] + 3 * v * u * u * R2[1] + u * u * u * R3[1]]; };
  const ease = k => k * k * (3 - 2 * k);
  function glow(x, y, r, c, a) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, rgba(c, a)); gr.addColorStop(1, rgba(c, 0)); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); }
  function sizeCanvas() { const d = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.round(SW * d); cv.height = Math.round(SH * d); g.setTransform(d, 0, 0, d, 0, 0); if (RM) drawScene(2.5); }

  function tower(x, label, c, lit, t) {
    const w = 46, h = 110, top = GROUND - h;
    g.fillStyle = '#12121c'; g.beginPath(); g.rect(x - w / 2, top, w, h); for (let i = 0; i < 4; i++) g.rect(x - w / 2 + i * (w / 4) + 2, top - 9, w / 4 - 4, 9); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.09)'; g.lineWidth = 1; g.beginPath(); g.moveTo(x - w / 2, top); g.lineTo(x - w / 2, GROUND); g.moveTo(x + w / 2, top); g.lineTo(x + w / 2, GROUND); g.stroke();
    for (let r = 0; r < 5; r++) { g.beginPath(); g.moveTo(x - w / 2, top + 20 + r * 20); g.lineTo(x + w / 2, top + 20 + r * 20); g.stroke(); }
    const flick = RM ? 1 : .85 + .15 * Math.sin(t * 7 + x);
    g.fillStyle = rgba(c, .55 * flick + .3 * lit); g.beginPath(); g.moveTo(x - 6, top + 52); g.lineTo(x - 6, top + 40); g.arc(x, top + 40, 6, Math.PI, 0); g.lineTo(x + 6, top + 52); g.fill();
    g.fillStyle = rgba(c, .35 * flick); g.fillRect(x - 3, top + 74, 6, 11);
    glow(x, top + 42, 34 + 18 * lit, c, .22 + .35 * lit);
    const by = top - 22;                                              // the beacon
    glow(x, by, 30 + 26 * lit, c, (.35 + .55 * lit) * flick);
    g.fillStyle = rgba(mixc(c, WHITE, .6), .9); g.beginPath(); g.arc(x, by, 3.4 + 2 * lit, 0, 7); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(x, top - 9); g.lineTo(x, by); g.stroke();
  }
  function label(text, x) {
    g.fillStyle = 'rgba(235,235,245,.6)'; g.font = '600 10px system-ui, sans-serif'; g.textAlign = 'center';
    if (g.letterSpacing !== undefined) g.letterSpacing = '1.5px';
    g.fillText(text, x, GROUND + 18);
    if (g.letterSpacing !== undefined) g.letterSpacing = '0px';
  }

  function crow(x, y, flee) {
    const k = flee ? clamp(flee) : 0, ox = k * 160, oy = -k * 90 - Math.sin(k * 9) * 6 * k;
    g.save(); g.globalAlpha = 1 - k * .9; g.translate(x + ox, y + oy);
    g.fillStyle = '#07070c'; g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 1;
    g.beginPath(); g.ellipse(0, 0, 11, 6.5, -.25, 0, 7); g.fill(); g.stroke();
    g.beginPath(); g.arc(10, -5, 4.6, 0, 7); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(14, -6); g.lineTo(21, -4); g.lineTo(14, -3); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(-9, 2); g.lineTo(-20, 8); g.lineTo(-8, 5); g.closePath(); g.fill();
    if (k > 0) { g.beginPath(); g.moveTo(-3, -3); g.quadraticCurveTo(-8, -20 - Math.sin(k * 40) * 5, 4, -9); g.closePath(); g.fill(); }
    g.fillStyle = rgba(RED_C, .9); g.beginPath(); g.arc(11, -6, 1.2, 0, 7); g.fill();
    g.restore();
  }

  function drawScene(t) {
    const s = clamp(S.storm / .08), tn = performance.now() / 1000;
    g.save(); g.clearRect(0, 0, SW, SH);
    let shake = 0;
    if (S.fx && S.fx.kind === 'bad' && !RM) { const k = (tn - S.fx.t0) / .5; if (k >= 0 && k < 1) shake = (1 - k) * 4; }
    if (shake) g.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    const sky = g.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, rgba(mixc([12, 14, 34], [20, 22, 28], s), 1)); sky.addColorStop(1, rgba(mixc([36, 34, 70], [38, 40, 48], s), 1));
    g.fillStyle = sky; g.fillRect(-10, -10, SW + 20, SH + 20);
    for (let i = 0; i < 70; i++) {                                    // stars, fewer behind a storm
      const tw = RM ? .8 : .55 + .45 * Math.sin(t * (1 + hash(i + 3) * 2) + i);
      g.fillStyle = 'rgba(235,240,255,' + (.75 * tw * (1 - s * .85) * (.3 + hash(i + 9) * .7)) + ')';
      const r = hash(i + 5) > .9 ? 1.6 : 1; g.fillRect(hash(i) * SW, hash(i + 1) * (GROUND - 40), r, r);
    }
    glow(560, 40, 70 - s * 30, [190, 200, 255], .28 * (1 - s * .7));  // the moon
    g.fillStyle = rgba([226, 232, 255], .95 - s * .5); g.beginPath(); g.arc(560, 40, 15, 0, 7); g.fill();
    g.fillStyle = rgba(mixc([36, 34, 70], [38, 40, 48], s), 1); g.beginPath(); g.arc(566, 36, 13, 0, 7); g.fill();
    for (let l = 0; l < 2; l++) {                                     // far hills
      g.fillStyle = l ? '#0d0d16' : '#15152a'; g.beginPath(); g.moveTo(0, GROUND);
      for (let x = 0; x <= SW; x += 16) g.lineTo(x, GROUND - 26 - l * 12 - Math.sin(x / (70 + l * 40) + l * 2) * 14 - Math.sin(x / 31 + l) * 5);
      g.lineTo(SW, GROUND); g.fill();
    }
    if (s > .02) {                                                    // storm clouds, rain and lightning
      const nc = 4 + Math.round(s * 5);
      for (let i = 0; i < nc; i++) {
        const cx = ((hash(i + 40) * (SW + 200) + t * (6 + hash(i) * 8)) % (SW + 200)) - 100, cy = 18 + hash(i + 60) * 36;
        for (let j = 0; j < 4; j++) glow(cx + j * 28 - 40, cy + Math.sin(j * 2 + i) * 6, 46, [34, 36, 46], .5 * s);
      }
      g.strokeStyle = 'rgba(190,205,235,' + (.1 + .2 * s) + ')'; g.lineWidth = 1; g.beginPath();
      for (let i = 0; i < 20 + s * 90; i++) {
        const x = (hash(i + 7) * (SW + 60) + (RM ? 0 : t * 30)) % SW, y = (hash(i + 8) * GROUND + (RM ? 0 : t * 300)) % GROUND;
        g.moveTo(x, y); g.lineTo(x - 5, y + 12);
      }
      g.stroke();
      const cyc = Math.floor(t / 3.4), ph = t - cyc * 3.4;
      if (!RM && s > .35 && hash(cyc + 3) < s && ph < .22) {
        const a = 1 - ph / .22; g.fillStyle = 'rgba(210,220,255,' + .16 * a + ')'; g.fillRect(0, 0, SW, SH);
        g.strokeStyle = 'rgba(235,240,255,' + a + ')'; g.lineWidth = 2; let x = 100 + hash(cyc) * 440, y = 10; g.beginPath(); g.moveTo(x, y);
        while (y < 110) { x += (hash(cyc * 7 + y) - .5) * 34; y += 18; g.lineTo(x, y); }
        g.stroke();
      }
    }
    // the road of light
    g.strokeStyle = 'rgba(190,210,255,.16)'; g.lineWidth = 1.6; g.setLineDash([2, 7]); g.lineCap = 'round';
    g.beginPath(); g.moveTo(R0[0], R0[1]); g.bezierCurveTo(R1[0], R1[1], R2[0], R2[1], R3[0], R3[1]); g.stroke(); g.setLineDash([]); g.lineCap = 'butt';
    const lit = who => (S.phase === who ? 1 : 0) + (who === 'bob' && (S.phase === 'sample' || S.phase === 'verdict') ? .6 : 0);
    tower(R0[0] - 26, 'ALICE', SUN_C, clamp(lit('alice')), t); tower(R3[0] + 26, 'BOB', MOON_C, clamp(lit('bob')), t);
    // Eve: a standing stone with a scrying orb, and a crow
    let flee = 0;
    if (S.fx && S.fx.crow) flee = clamp((tn - S.fx.t0 - .15) / 1.6);
    if (S.eve) {
      g.fillStyle = '#10101a'; g.beginPath(); g.moveTo(308, GROUND); g.lineTo(314, 66); g.lineTo(326, 66); g.lineTo(332, GROUND); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.1)'; g.stroke();
      const hot = S.flights.some(f => f.known && (t - f.t0) > .5);
      const pulse = RM ? .5 : .5 + .5 * Math.sin(t * 2.2);
      glow(320, 52, 34, hot ? RED_C : [210, 220, 255], .25 + .25 * pulse);
      g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1.4; g.fillStyle = 'rgba(255,255,255,.07)'; g.beginPath(); g.arc(320, 52, 13, 0, 7); g.fill(); g.stroke();

  // ---------- drafts: what this player has picked but not yet sent ----------

  }

  // ---------- editors ----------
  function editorAlice(v) {

  // ---------- reveal grids ----------

      let inner = `<span class="i">${i + 1}</span>${cell('sm ' + lensCls(a), lensIcon(a))}${cell('sm ' + lensCls(b), lensIcon(b))}`;

  // ---------- phases ----------

      controls = `<div class="panel"><h3>How many bits will you sacrifice?</h3>
        <p>The matching columns are your sifted key. You and ${v.role === 'bob' ? 'Alice' : 'Bob'} will read some of them aloud and compare. Those bits are spent. More bits make the test sharper and the key shorter.</p>

      <p class="fact">${esc(v.fact || '')}</p>
      <div class="acts"><button class="go" data-a="next" ${busy ? 'disabled' : ''}>${btn}</button></div></div>
      <div class="panel"><h3>The whole story</h3>
      <p>Red columns are key bits Eve holds for certain. Green columns are key bits that stayed secret.</p>${reveal(v, 'full')}</div>`;
  }

  // ---------- the table (projector view) ----------
  function screenTable(v) {
    const names = { alice: 'Alice', bob: 'Bob', eve: 'Eve' };
    const players = (v.humans || []).map(r => names[r]);
    const status = {
      alice: 'Alice is preparing the wisps', eve: 'Eve is deciding which wisps to tap', bob: 'Bob is choosing lenses',
      setup: 'Bob is choosing how many wisps to release', sample: 'The towers are choosing how many bits to compare', verdict: 'The towers are deciding: keep or abort',
    }[v.phase] || '';
    let body = '';
    if (v.phase === 'result' && v.result) body = screenResult(v);
    else {
      body = `<div class="panel"><p style="margin:0"><span class="dot pulse"></span>${status}</p></div>`;
      if (v.phase === 'sample') body += `<div class="panel"><h3>The lenses are announced</h3>${reveal(v, 'lens')}</div>`;
      if (v.phase === 'verdict') body += `<div class="panel"><h3>The bits are read aloud</h3><p class="num">${v.errors} of ${v.sample.length} disagree (${(v.qber * 100).toFixed(1)}%)</p>${meter(v)}${reveal(v, 'verdict')}</div>`;
    }
    return `${head(v)}${strip(v)}${body}`;
  }

  // ---------- top level ----------
  function screenGame(v) {
    $('root').classList.toggle('wide', v.role === 'table');
    if (v.role === 'table') return screenTable(v);
    let body = '';
    const mine = v.waiting.includes(v.role);
    switch (v.phase) {
      case 'setup': body = mine ? setupBob(v) : wait(v, 'Bob is choosing how many wisps the spell will release…'); break;
      case 'alice': body = mine ? editorAlice(v) : wait(v, 'Alice is preparing the wisps…'); break;
      case 'eve': body = mine ? editorEve(v) : wait(v, 'Eve is deciding which wisps to tap…'); break;
      case 'bob': body = mine ? editorBob(v) : wait(v, 'Bob is choosing lenses…'); break;
      case 'sample': body = screenSample(v); break;
      case 'verdict': body = screenVerdict(v); break;
      case 'result': body = screenResult(v); break;
      case 'over': body = `<div class="panel verdict mat badc"><div class="eyebrow">Run over</div><h3>The mana is gone</h3><p>You cannot afford the smallest message.</p>
        <p class="num">Final score <b style="color:var(--label)">${v.score}</b></p><div class="acts"><button class="go" data-a="next">Start again</button></div></div>`; break;
    }
    let wait2 = '';
    if (v.role === 'alice' && v.phase !== 'alice' && v.aBits && (v.phase === 'eve' || v.phase === 'bob'))
      wait2 = wait(v, v.phase === 'eve' ? 'Your wisps are on the road. Eve is deciding…' : 'Bob is catching your wisps…');
    if (v.role === 'eve' && v.eRes && v.phase === 'bob') wait2 = wait(v, 'You measured the wisps and sent them on. Bob is catching them…');
    if (v.role === 'bob' && v.bRes && v.phase === 'verdict' && !mine) wait2 = '';
    return `${head(v)}${strip(v)}${wait2}${body}`;
  }
  function screenMsg(title, text) { return `<div class="panel msg"><h3>${title}</h3><p>${text}</p></div>`; }

  function draw() {
    if (!P) return;
    const act = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.f : null;
    const scrollY = window.scrollY;
    let html = '';
    if (P.kind === 'game') html = screenGame(P.view);
    else if (P.kind === 'lobby') {
      const r = { alice: 'Alice', bob: 'Bob', eve: 'Eve' }[P.role];
      html = `<div class="top"><div><div class="eyebrow">Room ${esc(P.code || '')}</div><h2>You are ${r}</h2></div></div>` +
        `<div class="panel msg"><h3>You are in</h3><p><span class="dot on pulse"></span>Waiting for the table to press Play. Keep this screen open.</p></div>`;
    }
    else if (P.kind === 'taken') html = screenMsg('This seat is taken', 'Another phone already joined with this code. Ask the table for another code.');
    else if (P.kind === 'started') html = screenMsg('The game has already started', 'Late arrivals cannot join a game in progress.');
    else if (P.kind === 'missing') html = screenMsg('This room has closed', 'The code is wrong, or the room expired. Ask the table to open a new game.');
    else html = screenMsg('Joining…', 'Finding your seat.');
    $('main').innerHTML = html;
    sceneState(P);
    if (act) { const el = document.querySelector('[data-f="' + act + '"]'); if (el) el.focus({ preventScroll: true }); }
    fit();
  }

  // ---------- events ----------
  const rndFill = n => Array.from({ length: n }, rb);
  document.addEventListener('input', e => {
    const a = e.target.dataset && e.target.dataset.a; if (!a || !P) return;
    if (a === 'n') { draft.n = +e.target.value; draft.lens = draft.bits = null; draw(); const el = $('nn'); if (el) el.focus({ preventScroll: true }); }
    if (a === 'n0') { draft.n = +e.target.value; $('bigN').textContent = draft.n; const c = document.querySelector('#main .panel p.num'); if (c && P.view.mode === 'bob') c.textContent = `Costs ${draft.n} mana. You have ${P.view.mana}; you receive 24 more each round, up to ${P.view.manaMax}.`; }
  });
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b || b.disabled || busy || !P) return;
    const a = b.dataset.a, i = +b.dataset.i, v = P.view; if (b.tagName === 'INPUT') return;
    if (a === 'lens') { draft.lens[i] = draft.lens[i] === null ? 0 : draft.lens[i] === 0 ? 1 : 0; draw(); }
    else if (a === 'bit') { draft.bits[i] = draft.bits[i] === null ? 0 : 1 - draft.bits[i]; draw(); }
    else if (a === 'tap') { draft.tap[i] = draft.tap[i] === -1 ? 0 : draft.tap[i] === 0 ? 1 : -1; draw(); }
    else if (a === 'fillA') { draft.lens = rndFill(draft.n); draft.bits = rndFill(draft.n); draw(); }
    else if (a === 'fillB') { draft.lens = rndFill(v.n); draw(); }
    else if (a === 'share') {
      const f = +b.dataset.f2, k = Math.round(f * v.n), idx = Array.from({ length: v.n }, (_, j) => j);
      for (let j = idx.length - 1; j > 0; j--) { const r = crypto.getRandomValues(new Uint32Array(1))[0] % (j + 1); [idx[j], idx[r]] = [idx[r], idx[j]]; }
      draft.tap = Array(v.n).fill(-1); idx.slice(0, k).forEach(j => draft.tap[j] = rb()); draw();
    }
    else if (a === 'frac') { draft.f = +b.dataset.f2; draw(); }
    else if (a === 'setN') sendAct('set_n', { n: draft.n });
    else if (a === 'lockA') sendAct('alice_lock', { n: draft.n, bits: draft.bits, lens: draft.lens });
    else if (a === 'lockE') sendAct('eve_lock', { choice: draft.tap });
    else if (a === 'lockB') { flight(v.n, 0); sendAct('bob_lock', { lens: draft.lens }); }
    else if (a === 'doSample') sendAct('set_sample', { fraction: draft.f });
    else if (a === 'keep') sendAct('verdict', { choice: 'keep' });
    else if (a === 'abort') sendAct('verdict', { choice: 'abort' });
    else if (a === 'next') sendAct('next', {});
  });

  window.addEventListener('message', e => {
    const d = e.data; if (!d || d.type !== 'streamlit:render') return;
    const np = d.args && d.args.payload; if (!np) return;
    const sig = JSON.stringify(np);
    if (sig === lastSig) return;
    lastSig = sig;
    const prev = P; P = np; busy = false; clearTimeout(busyTimer);
    if (np.kind === 'game') {
      const v = np.view;
      if (prev && prev.kind === 'game' && prev.view.round === v.round && prev.view.phase !== v.phase && ['sample', 'result'].includes(v.phase) && v.n && ['eve', 'bob'].includes(prev.view.phase))
        flight(v.n, v.phase === 'result' && v.result ? v.result.tapped / v.n : 0);
      else if (prev && prev.kind === 'game' && v.phase === 'result' && prev.view.phase !== 'result' && v.n) flight(v.n, v.result ? v.result.tapped / v.n : 0);
      if (v.solo && v.score > best) { best = v.score; try { localStorage.setItem('qc_wisp_best', String(best)); } catch (er) {} }
      const fresh = !(prev && prev.kind === 'game' && prev.view.phase === 'result' && prev.view.round === v.round);
      if (v.phase === 'result' && v.result && fresh) outcomeFx(v);
    }
    draw();
  });
  buildScene();
  new ResizeObserver(fit).observe(document.body);
  post('streamlit:componentReady', { apiVersion: 1 });
  setValue({ type: 'hello', client: CLIENT, nonce: CLIENT + ':hello' });
  fit();
})();
</script></body></html>
